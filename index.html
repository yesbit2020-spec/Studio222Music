<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Portal - Studio 222 Music</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --text-main: #f5f6f8;
            --text-muted: #8b92a5;
            --accent: #d4af37;
            --border: rgba(255, 255, 255, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 4rem 5%;
            line-height: 1.6;
        }

        header {
            margin-bottom: 4rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            text-decoration: none;
            display: block;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-number {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .card-title {
            color: var(--text-main);
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Initial empty state placeholder for future items */
        .card.empty {
            border: 1px dashed var(--border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 310px;
            cursor: default;
        }

        .card.empty:hover {
            transform: none;
            border-color: var(--border);
            box-shadow: none;
        }

        .card.empty .card-title {
            color: var(--text-muted);
            font-weight: 400;
        }
    </style>
</head>
<body>

    <header>
        <h1>Studio 222 Mockups</h1>
        <p class="subtitle">Project Design Concepts & Iterations</p>
    </header>

    <div class="grid">
        <!-- Mockup 01 -->
        <a href="mockups/01_landing_page.html" class="card">
            <img src="mockups/thumb_01.jpg" alt="Mockup 01 Thumbnail" class="card-img">
            <div class="card-content">
                <span class="card-number">01</span>
                <h2 class="card-title">Landing Page (Dark)</h2>
                <p class="card-desc">Initial concept for the premium music studio landing page.</p>
            </div>
        </a>

        <!-- Placeholder for future mockups -->
        <div class="card empty">
            <h2 class="card-title">+ New Mockup</h2>
        </div>
    </div>

</body>
</html>
